spring:
  application:
    name: carbontrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carbontrack}
    username: ${DB_USERNAME:carbontrack}
    password: ${DB_PASSWORD:carbontrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-local-dev-only-secret-change-me-0123456789}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}
    allow-dev-secret: ${JWT_ALLOW_DEV_SECRET:false}   # local development only; see JwtSecretGuard
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
