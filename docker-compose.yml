# Local development: Postgres only. Run the backend and frontend on the host.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carbontrack
      POSTGRES_USER: carbontrack
      POSTGRES_PASSWORD: carbontrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
